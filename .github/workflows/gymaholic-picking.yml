name: Gymaholic picking nightly

on:
  schedule:
    # Cron en UTC: '45 5 * * *' = 23:45 CDMX (America/Mexico_City, UTC-6)
    - cron: '45 5 * * *'
  workflow_dispatch: {}

jobs:
  run-picking:
    name: Run picking (dry run + optional send)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Dry run: run picking script and save output
        run: |
          python scripts/gymaholic_picking.py -i samples/orders.json > picking_output.txt 2>&1 || true

      - name: Upload picking output (dry run)
        uses: actions/upload-artifact@v4
        with:
          name: picking-output
          path: picking_output.txt

      # Si configuras secrets, la siguiente step intentará enviar (condicional)
      - name: Optional: attempt send via SMTP/Telegram (only if secrets present)
        if: ${{ secrets.SMTP_PASS != '' || secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Ejecuta el script pidiendo el envío; si falla no detiene el workflow por el || true
          python scripts/gymaholic_picking.py -i samples/orders.json --send-telegram --send-email > picking_send_output.txt 2>&1 || true
          echo "Artifact with send log:"
          ls -la
      - name: Upload sending log (if any)
        if: ${{ secrets.SMTP_PASS != '' || secrets.TELEGRAM_BOT_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: picking-send-log
          path: picking_send_output.txt
